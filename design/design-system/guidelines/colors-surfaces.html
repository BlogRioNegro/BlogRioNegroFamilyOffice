<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--color-bg);font-family:var(--font-sans);color:var(--color-text)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:120px}.chip{height:64px;border-radius:var(--radius-control);border:1px solid var(--color-border)}.n{font-size:14px;font-weight:600;margin-top:8px}.t{font-size:14px;color:var(--color-text-muted);font-family:ui-monospace,Menlo,monospace}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--color-bg)"></div><div class="n">color-bg</div><div class="t">#F2F0EF</div></div><div class="sw"><div class="chip" style="background:var(--color-surface)"></div><div class="n">color-surface</div><div class="t">#FFFFFF</div></div><div class="sw"><div class="chip" style="background:var(--color-surface-muted)"></div><div class="n">color-surface-muted</div><div class="t">#E9E6E4</div></div><div class="sw"><div class="chip" style="background:var(--color-border)"></div><div class="n">color-border</div><div class="t">#DCD8D5</div></div><div class="sw"><div class="chip" style="background:var(--color-border-strong)"></div><div class="n">color-border-strong</div><div class="t">#8C8782</div></div></div></body></html>
