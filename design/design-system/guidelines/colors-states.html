ror-bg)"></div><div><div class="n" style="margin:0">color-error-bg</div><div class="t">#F8E6E4</div></div></div><div class="sw" style="display:flex;gap:10px;align-items:center"><div class="chip" style="width:48px;height:48px;flex:none;background:var(--color-error-border)"></div><div><div class="n" style="margin:0">color-error-border</div><div class="t">#E6BDB9</div></div></div></div><div class="row" style="margin-bottom:12px;align-items:center"><div style="width:72px;font-size:14px;font-weight:600">Aviso</div><div class="sw" style="display:flex;gap:10px;align-items:center"><div class="chip" style="width:48px;height:48px;flex:none;background:var(--color-warning)"></div><div><div class="n" style="margin:0">color-warning</div><div class="t">#8A5A00</div></div></div><div class="sw" style="display:flex;gap:10px;align-items:center"><div class="chip" style="width:48px;height:48px;flex:none;background:var(--color-warning-bg)"></div><div><div class="n" style="margin:0">color-warning-bg</div><div class="t">#F7EDD9</div></div></div><div class="sw" style="display:flex;gap:10px;align-items:center"><div class="chip" style="width:48px;height:48px;flex:none;background:var(--color-warning-border)"></div><div><div class="n" style="margin:0">color-warning-border</div><div class="t">#E3CB98</div></div></div></div></body></html>
