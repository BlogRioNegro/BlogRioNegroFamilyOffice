<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { Input, PhoneInput, Checkbox, Label, FieldMessage } = window.RioNegroDesignSystem_2f3caf;

function App(){return <div>
<div className="g sec" style={{gridTemplateColumns:'1fr 1fr',alignItems:'start',gap:20}}>
<Input label="Nome completo" placeholder="Maria Souza"/>

<PhoneInput/>
<PhoneInput defaultValue="1191234" error="Informe um celular com DDD, 11 dígitos."/>
</div>
<p className="h">Checkbox com label longa e link interno</p>
<div style={{display:'grid',gap:16,maxWidth:560}}>
<Checkbox>Li e concordo com a <a href="#">Política de Privacidade</a> e autorizo a Rio Negro Assessoria de Investimentos a entrar em contato por e-mail, telefone e WhatsApp com conteúdos sobre investimentos.</Checkbox>

<Checkbox error="Você precisa aceitar a Política de Privacidade para continuar.">Li e concordo com a <a href="#">Política de Privacidade</a>.</Checkbox>
