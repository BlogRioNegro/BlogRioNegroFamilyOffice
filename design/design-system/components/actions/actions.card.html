<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--color-bg)}.g{display:grid;gap:12px 16px;align-items:center}.lab{font-size:14px;color:var(--color-text-muted)}.h{font-size:14px;font-weight:600;margin:0 0 12px}.sec{margin-bottom:28px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { Button, LoadMoreButton } = window.RioNegroDesignSystem_2f3caf;

const states=[['Default',{}],['Hover',{className:'is-hover'}],['Foco',{className:'is-focus'}],['Desabilitado',{disabled:true}],['Carregando',{loading:true}]];
const V=[['primary','Primário','Baixar PDF'],['secondary','Secundário','Cancelar'],['ghost','Ghost','Editar'],['link','Link','Ver todos']];
function App(){return <div>
<div className="g sec" style={{gridTemplateColumns:'88px repeat(5,1fr)'}}>
<span/>{states.map(s=><span key={s[0]} className="lab">{s[0]}</span>)}
{V.map(([v,l,t])=><React.Fragment key={v}><span className="lab">{l}</span>{states.map(([s,p])=><div key={s}>{v==='link'&&s==='Carregando'?<span className="lab">—</span>:<Button variant={v} size="sm" {...p}>{t}</Button>}</div>)}</React.Fragment>)}
</div>
<p className="h">Tamanhos e ícones</p>
<div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center'}} className="sec">
<Button iconRight="download">Baixar PDF</Button><Button variant="secondary" iconLeft="arrow-left">Voltar</Button><Button variant="ghost" iconOnly="pencil" label="Editar"/><Button size="sm" iconLeft="plus">Novo artigo</Button></div>
<p className="h">Carregar mais — default · carregando · erro · fim</p>
<div className="g" style={{gridTemplateColumns:'1fr 1fr'}}><LoadMoreButton/><LoadMoreButton loading/><LoadMoreButton error/><LoadMoreButton done/></div>
</div>}
ReactDOM.createRoot(root).render(<App/>);
</script></body></html>
