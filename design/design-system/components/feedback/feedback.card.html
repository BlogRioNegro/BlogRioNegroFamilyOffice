<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { Alert, TypeBadge, StatusBadge, Modal, Button, Input, PhoneInput, Checkbox } = window.RioNegroDesignSystem_2f3caf;

function Form(){return <div style={{display:'grid',gap:16}}><p style={{margin:0,fontSize:16,color:'var(--color-text-muted)'}}>Informe seus dados para receber o PDF por e-mail.</p><Input label="Nome"/><Input label="E-mail" type="email"/></div>}
function App(){return <div>
<div style={{display:'grid',gap:12}} className="sec">
<Alert variant="success" title="Pronto! O PDF foi enviado.">Confira sua caixa de entrada em alguns minutos.</Alert>
<Alert variant="error" title="Não foi possível enviar.">Verifique sua conexão e tente novamente.</Alert>
<Alert variant="warning" title="Este artigo está sem capa.">A listagem mostrará uma área neutra no lugar da imagem.</Alert>
</div>
<p className="h">Badges</p>
<div style={{display:'flex',gap:8,flexWrap:'wrap'}} className="sec"><TypeBadge type="pdf"/><TypeBadge type="text"/><span style={{width:16}}/><StatusBadge status="disabled"/><StatusBadge status="pending"/><StatusBadge status="sent"/><StatusBadge status="failed"/></div>
<p className="h">Modal — desktop (480 px) e mobile (tela cheia)</p>
<div style={{display:'flex',gap:24,alignItems:'flex-start',padding:24,background:'var(--color-overlay)',borderRadius:12}}>
<Modal inline title="Receba o artigo completo" footer={<><Button variant="secondary">Cancelar</Button><Button>Receber PDF</Button></>}><Form/></Modal>
<div style={{width:180,height:360,flex:'none',border:'1px solid var(--color-border)',borderRadius:8,overflow:'hidden',background:'#fff'}}><div style={{width:390,height:780,transform:'scale(.4615)',transformOrigin:'0 0'}}><Modal inline mobile title="Receba o artigo completo" footer={<><Button variant="secondary">Cancelar</Button><Button>Receber PDF</Button></>}><Form/></Modal></div></div>
</div></div>}
ReactDOM.createRoot(root).render(<App/>);
</script></body></html>
