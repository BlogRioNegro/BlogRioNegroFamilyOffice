<!-- @dsCard group="Componentes" viewport="700x760" name="Tabela do admin" subtitle="Ações por linha, hover, paginação, carregando e vazio" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--color-bg)}.g{display:grid;gap:12px 16px;align-items:center}.lab{font-size:14px;color:var(--color-text-muted)}.h{font-size:14px;font-weight:600;margin:0 0 12px}.sec{margin-bottom:28px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel">
const { DataTable, Pagination, Button, TypeBadge, StatusBadge } = window.RioNegroDesignSystem_2f3caf;

const rows=[{id:1,title:'Carta mensal — setembro',type:'pdf',status:'sent',date:'20/09/2026'},{id:2,title:'Renda fixa em 2026',type:'pdf',status:'pending',date:'12/09/2026'},{id:3,title:'PGBL ou VGBL?',type:'text',status:'failed',date:'05/09/2026'},{id:4,title:'Reserva de emergência',type:'text',status:'disabled',date:'29/08/2026'}];
const cols=[{key:'title',label:'Título'},{key:'type',label:'Tipo',render:r=><TypeBadge type={r.type}/>},{key:'status',label:'Envio',render:r=><StatusBadge status={r.status}/>},{key:'date',label:'Publicado',muted:true},{key:'a',label:'Ações',align:'right',render:r=><div className="rn-table__actions"><Button variant="ghost" size="sm" iconOnly="pencil" label={'Editar '+r.title}/><Button variant="ghost" size="sm" iconOnly="trash" label={'Excluir '+r.title}/></div>}];
function App(){const[p,setP]=React.useState(1);return <div>
<div className="sec"><DataTable caption="Artigos" columns={cols} rows={rows} hoverRow={1} footer={<Pagination page={p} totalPages={5} total={48} pageSize={10} onChange={setP}/>}/></div>
<div className="g" style={{gridTemplateColumns:'1fr 1fr',alignItems:'start'}}><div><p className="lab">Carregando</p><DataTable columns={cols.slice(0,3)} rows={[]} loading/></div><div><p className="lab">Vazio</p><DataTable columns={cols.slice(0,3)} rows={[]} emptyMessage="Nenhum artigo publicado ainda."/></div></div>
</div>}
ReactDOM.createRoot(root).render(<App/>);
</script></body></html>
